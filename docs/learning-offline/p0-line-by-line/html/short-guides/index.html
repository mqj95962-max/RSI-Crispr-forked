<!DOCTYPE html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Short guides</title><style>
:root {
  --bg: #f6f7f9;
  --card: #ffffff;
  --text: #1f2328;
  --muted: #656d76;
  --border: #d0d7de;
  --code-bg: #f0f3f6;
  --code-border: #d8dee4;
  --accent: #0969da;
  --plain: #1a7f37;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --text: #e6edf3;
    --muted: #8b949e;
    --border: #30363d;
    --code-bg: #0d1117;
    --code-border: #30363d;
    --accent: #2f81f7;
    --plain: #3fb950;
  }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  line-height: 1.55;
  color: var(--text);
  background: var(--bg);
}
.wrap {
  max-width: 820px;
  margin: 0 auto;
  padding: 1.25rem 1rem 4rem;
}
nav.top {
  position: sticky; top: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  margin: -1.25rem -1rem 1.5rem;
  padding: 0.75rem 1rem;
  display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center;
}
nav.top a { color: var(--accent); text-decoration: none; font-size: 0.92rem; }
nav.top a:hover { text-decoration: underline; }
nav.top .title { font-weight: 600; color: var(--text); margin-right: auto; }
h1,h2,h3,h4 { line-height: 1.25; }
h1 { font-size: 1.6rem; margin-top: 0; }
h2 { font-size: 1.25rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; margin-top: 2rem; }
h3 { font-size: 1.05rem; margin-top: 1.4rem; color: var(--muted); }
p { margin: 0.65rem 0; }
strong { font-weight: 650; }
a { color: var(--accent); }
hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.88em;
  background: var(--code-bg);
  border: 1px solid var(--code-border);
  border-radius: 4px;
  padding: 0.1em 0.35em;
}
pre {
  background: var(--code-bg);
  border: 1px solid var(--code-border);
  border-radius: 8px;
  padding: 0.85rem 1rem;
  overflow-x: auto;
  line-height: 1.4;
}
pre code {
  border: none;
  background: transparent;
  padding: 0;
  font-size: 0.82rem;
}
table {
  border-collapse: collapse;
  width: 100%;
  margin: 1rem 0;
  font-size: 0.95rem;
  background: var(--card);
}
th, td {
  border: 1px solid var(--border);
  padding: 0.45rem 0.6rem;
  text-align: left;
  vertical-align: top;
}
th { background: color-mix(in srgb, var(--card) 80%, var(--border)); }
blockquote {
  margin: 1rem 0;
  padding: 0.4rem 0.9rem;
  border-left: 4px solid var(--accent);
  color: var(--muted);
  background: var(--card);
}
ul, ol { padding-left: 1.3rem; }
li { margin: 0.25rem 0; }
/* Make "Plain English" stand out a bit */
p strong:first-child { color: var(--plain); }
.footer {
  margin-top: 3rem;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 0.9rem;
}
@media print {
  nav.top { position: static; backdrop-filter: none; }
  body { background: white; color: black; }
  a { color: black; text-decoration: none; }
  pre { white-space: pre-wrap; }
}
